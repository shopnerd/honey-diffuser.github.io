<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #ffffff, #d9d9d9, #bfbfbf);
	/*background: radial-gradient(circle at center, #fff2cc, #e0b85b);*/
	/*background: radial-gradient(circle at center, #dbe4f0, #a0b1c4);*/
	/*background: radial-gradient(circle at center, #2b2b2b, #000000);*/




        font-family: 'Poppins', sans-serif;
      }

      canvas {
        display: block;
      }

      #loading {
        color: white;
        font-size: 14px;
        letter-spacing: 1px;
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading model...</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';


      let scene, camera, renderer, model, controls;
      let mouseX = 0;

      init();
      animate();
      setupHDRIEnvironment();
      function init() {
        console.log('Initializing...');
        
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(0, 1, 3);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(3, 3, 3);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        /*
        // Create a demo model (colorful cube)
        console.log('Creating demo model...');
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ 
          color: 0x00ff88,
          metalness: 0.5,
          roughness: 0.2
        });
        model = new THREE.Mesh(geometry, material);
        scene.add(model);
        
        // Hide loading message
        const loadingEl = document.getElementById('loading');
        if (loadingEl) {
          loadingEl.style.display = 'none';
        }
        console.log('Model loaded!');
        */
        // Mouse interaction
        document.addEventListener('mousemove', onMouseMove);
        window.addEventListener('resize', onWindowResize);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = true;
      }
	function setupHDRIEnvironment() {
	  const rgbeLoader = new RGBELoader();
  	  rgbeLoader.load(
    		'myfile.hdr', // <-- replace with your HDRI path
    		(texture) => {
      		texture.mapping = THREE.EquirectangularReflectionMapping;
      		scene.environment = texture;   // adds realistic lighting/reflections
      		//scene.background = texture;    // optional: shows HDRI as background
      		console.log('HDRI environment loaded!');
    	},
    		undefined,
    		(error) => console.error('Error loading HDRI:', error)
  	);
}



      function onMouseMove(event) {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      }

      function animate() {
        requestAnimationFrame(animate);

        if (model) {
          // Smooth rotation based on mouse position
          model.rotation.y += (mouseX * Math.PI - model.rotation.y) * 0.05;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // To load a GLTF model instead, uncomment this:
      function loadGLTFModel(path) {
        const loader = new GLTFLoader();
        loader.load(
          path,
          (gltf) => {
            model = gltf.scene;
            scene.add(model);
            document.getElementById('loading').style.display = 'none';
            console.log('GLTF Model loaded!');
          },
          (xhr) => console.log(`Loading ${(xhr.loaded / xhr.total * 100).toFixed(1)}%`),
          (error) => console.error('Error loading model:', error)
        );
      }
      // Call it like this: 
      loadGLTFModel('Honey Drizzler Gold.glb');
      
    </script>
  </body>

</html>
